name: Prepare challenge draft

on:
  workflow_dispatch:
    inputs:
      challenge_id:
        description: 'ID из backlog с fixture (пусто = первая подходящая тема)'
        required: false
        type: string
      create_draft_pr:
        description: 'Создать внешнюю ветку и draft PR (явное разрешение владельца)'
        required: true
        default: false
        type: boolean
  # Включается только после разрешения владельца через repository variables.
  schedule:
    - cron: '17 13 * * 2' # вторник 16:17 МСК, подготовка, НЕ публикация

permissions:
  contents: read

concurrency:
  group: prepare-challenge
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || vars.ENABLE_WEEKLY_PREPARATION == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      challenge_id: ${{ steps.package.outputs.id }}
      changed: ${{ steps.package.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Prepare deterministic fixture package
        id: package
        env:
          CHALLENGE_ID: ${{ inputs.challenge_id }}
        run: python tools/prepare_workflow.py
      - name: Validate and compile draft
        run: python tools/editorial.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: challenge-draft
          path: |
            challenges/
            catalog/
            pom.xml
            docs/releases/
          retention-days: 7
      - name: Checks actually run
        run: |
          echo 'Fixture package, catalog/tool tests, starter + JUnit compilation passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Behavior tests on an external implementation are still REQUIRED before approval.' >> "$GITHUB_STEP_SUMMARY"

  draft-pr:
    needs: prepare
    if: >-
      needs.prepare.outputs.changed == 'true' &&
      ((github.event_name == 'workflow_dispatch' && inputs.create_draft_pr) ||
       (github.event_name == 'schedule' && vars.ENABLE_DRAFT_PR == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Reproduce package and open draft PR
        env:
          CHALLENGE_ID: ${{ needs.prepare.outputs.challenge_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python tools/create_draft_pr.py
